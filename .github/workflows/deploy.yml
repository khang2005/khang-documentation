name: Deploy Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy to R2
        run: |
          node << 'EOF'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const bucket = 'docs-k8s-audit';
          const fs = require('fs');
          const path = require('path');

          const mimeTypes = {
            'html': 'text/html',
            'css': 'text/css',
            'js': 'application/javascript',
            'json': 'application/json',
            'png': 'image/png',
            'jpg': 'image/jpeg',
            'jpeg': 'image/jpeg',
            'svg': 'image/svg+xml',
            'ico': 'image/x-icon',
            'xml': 'application/xml',
            'gz': 'application/gzip',
            'map': 'application/json',
            'woff': 'font/woff',
            'woff2': 'font/woff2'
          };

          function getContentType(filepath) {
            const ext = filepath.split('.').pop()?.toLowerCase();
            return mimeTypes[ext] || 'application/octet-stream';
          }

          function collectFiles(dir, prefix = '', out = []) {
            for (const file of fs.readdirSync(dir)) {
              const filepath = path.join(dir, file);
              const stat = fs.statSync(filepath);
              if (stat.isDirectory()) {
                collectFiles(filepath, prefix + file + '/', out);
              } else {
                out.push({ filepath, key: prefix + file });
              }
            }
            return out;
          }

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function uploadFile(file, attempt = 1) {
            const body = fs.readFileSync(file.filepath);
            const contentType = getContentType(file.filepath);
            const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/r2/buckets/${encodeURIComponent(bucket)}/objects/${encodeURIComponent(file.key)}`;

            try {
              const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': contentType },
                body,
              });
              const data = await response.json();

              if (data.success) {
                console.log(`✓ ${file.key}`);
                return true;
              }

              const rateLimited =
                data.errors && data.errors.some((e) => e.code === 10429 || (response.status >= 429));

              if (rateLimited && attempt < 6) {
                const wait = Math.min(1000 * Math.pow(2, attempt - 1), 15000);
                console.log(`Rate limited on ${file.key}, retrying (${attempt}/5) in ${wait}ms`);
                await sleep(wait);
                return uploadFile(file, attempt + 1);
              }

              console.error(`Failed to upload ${file.key}:`, JSON.stringify(data));
              return false;
            } catch (err) {
              if (attempt < 6) {
                const wait = Math.min(1000 * Math.pow(2, attempt - 1), 15000);
                console.log(`Error uploading ${file.key} (${err.message}), retrying (${attempt}/5) in ${wait}ms`);
                await sleep(wait);
                return uploadFile(file, attempt + 1);
              }
              console.error(`Failed to upload ${file.key}:`, err.message);
              return false;
            }
          }

          async function uploadWithConcurrency(files, concurrency) {
            let idx = 0;
            const failed = [];

            async function worker() {
              while (idx < files.length) {
                const current = idx++;
                const ok = await uploadFile(files[current]);
                if (!ok) failed.push(files[current].key);
              }
            }

            const workers = [];
            for (let i = 0; i < concurrency; i++) workers.push(worker());
            await Promise.all(workers);
            return failed;
          }

          async function main() {
            const files = collectFiles('site');
            console.log(`Uploading ${files.length} files to R2 bucket '${bucket}' (concurrency 5, with retries)...`);

            const failed = await uploadWithConcurrency(files, 5);

            if (failed.length > 0) {
              console.error(`${failed.length} file(s) failed to upload:`);
              for (const key of failed) console.error(`  - ${key}`);
              process.exitCode = 1;
            } else {
              console.log('All files uploaded successfully!');
            }
          }

          main();
          EOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Worker
        working-directory: worker
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
