site_name: Khang Duy Tran - Documentation Hub
site_description: Technical documentation hub for multiple projects by Khang Duy Tran
site_url: https://docs.khangduytran.xyz

repo_name: khang2005/khang-documentation
repo_url: https://github.com/khang2005/khang-documentation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - pymdownx.mark

plugins:
  - search
  - mermaid2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/khangduytran
  generator: false

nav:
  - Home: index.md
  - Projects:
      - AI Chatbox Map:
          - Overview: projects/ai-chatbox-map/index.md
          - System Architecture: projects/ai-chatbox-map/architecture.md
          - Session Memory: projects/ai-chatbox-map/session-memory.md
          - Deployment: projects/ai-chatbox-map/deployment.md
          - Provider Comparison: projects/ai-chatbox-map/provider-comparison.md
      - RepoLens (RAG-Based Codebase Onboarding):
