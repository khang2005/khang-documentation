          - System Architecture: projects/repolens/architecture.md
          - RAG Workflow: projects/repolens/rag-workflow.md
          - Repository Ingestion: projects/repolens/ingestion.md
          - Embedding & Storage: projects/repolens/embedding-storage.md
          - Retrieval & Generation: projects/repolens/retrieval.md
          - Citations & Hallucination: projects/repolens/citations.md
          - API Design: projects/repolens/api-design.md
          - Project Structure: projects/repolens/project-structure.md
          - Deployment: projects/repolens/deployment.md
          - Testing Strategy: projects/repolens/testing.md
          - Setup & Usage: projects/repolens/setup.md
